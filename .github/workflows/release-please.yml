name: release-please

on:
  push:
    branches: [main]

# contents: write to push the version bump / CHANGELOG.md commit and create the
# tag + GitHub Release; pull-requests and issues: write for release-please to
# open, update, and label the release PR.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
