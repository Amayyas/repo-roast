name: CI

on:
  push:
    branches: [main]
  pull_request:

# On a pull request, a fresh push supersedes the run it replaces -- nobody cares
# about the verdict on a commit that no longer exists.
#
# On main, never cancel: two merges landing back to back would leave the first
# commit with no CI result at all, and the badge showing a cancelled run for a
# tree that is perfectly healthy. Every commit on main is a release candidate and
# deserves its own verdict, even if the next one is seconds behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing here needs to write to the repository. Pull requests
# from forks get a read-only token and no access to secrets, which is what makes
# it safe to run this on contributions from strangers.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy --strict src tests

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # An outdated bundled pip shows up as a false-positive-looking finding of
      # its own; upgrading it first keeps the audit about what we actually ship.
      - run: pip install --upgrade pip
      # Only the runtime dependencies, not [dev]: a CVE in ruff or pytest never
      # ships to a user's machine, and would just be noise here.
      - run: pip install .
      - run: pip install pip-audit
      - run: pip-audit

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The suite is hermetic: no token, no key, no network. If a test ever
      # reaches for a socket, conftest makes it fail rather than pass quietly.
      - run: pytest --cov=repo_roast --cov-report=term-missing --cov-fail-under=90

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A real, non-editable install: this is what proves the src layout, the
      # packaging and the console_scripts entry point actually work for a user.
      - run: pip install .
      - run: repo-roast --help
      - name: A missing GITHUB_TOKEN fails clearly
        run: |
          set +e
          output=$(repo-roast roast torvalds --dry-run 2>&1)
          status=$?
          set -e
          echo "$output"
          [ "$status" -ne 0 ] || { echo "::error::expected a non-zero exit"; exit 1; }
          echo "$output" | grep -q "GITHUB_TOKEN is not set" \
            || { echo "::error::expected a clear message about GITHUB_TOKEN"; exit 1; }

      # Regression guard. A bare load_dotenv() resolves .env relative to the
      # module's own directory -- site-packages, once installed for real -- so it
      # silently ignored the user's .env. Only a non-editable install shows this,
      # which is exactly what this job is.
      - name: The .env in the working directory is actually read
        run: |
          mkdir -p /tmp/userdir && cd /tmp/userdir
          echo "GITHUB_TOKEN=ghp_definitely_not_a_real_token" > .env
          set +e
          output=$(repo-roast roast torvalds --dry-run 2>&1)
          set -e
          echo "$output"
          echo "$output" | grep -q "GITHUB_TOKEN is not set" \
            && { echo "::error::the .env in the working directory was ignored"; exit 1; }
          echo "$output" | grep -q "rejected your GITHUB_TOKEN" \
            || { echo "::error::expected the token from .env to be sent and refused"; exit 1; }

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # load: true, not push: single platform (the runner's own arch) is enough
      # to lint the Dockerfile and scan for CVEs on every PR. The real
      # multi-arch build only happens in release-please.yml, on an actual
      # release -- there is no registry to push a PR's image to anyway.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: repo-roast:ci
      # Not a one-time check: python:3.12-slim-bookworm is a moving tag, and an
      # OS-level CVE can appear in it independently of anything this repo
      # changes. Scanning on every push keeps that drift caught continuously
      # rather than trusted once at Dockerfile-authoring time. ignore-unfixed
      # skips CVEs upstream has not patched yet -- failing on those would be a
      # permanently red, unactionable check.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: repo-roast:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
