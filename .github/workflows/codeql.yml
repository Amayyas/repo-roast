name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependencies change weekly (see dependabot.yml); a query pack update
    # can surface a real finding in code nobody touched this week.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: "/language:python"
