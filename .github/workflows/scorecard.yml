name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 3"

# Not run on pull_request: a fork PR gets a read-only token with no
# id-token, which publishing a Scorecard result requires. Scorecard assesses
# the repo's overall posture, not a diff, so main + a weekly schedule covers it.
permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      # Scorecard needs to read all repo data to score it, and to publish the
      # result and its provenance attestation.
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: results.sarif
