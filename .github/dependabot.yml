version: 2
updates:
  # Keeps runtime and dev dependencies current, including transitive bumps
  # that fix a CVE even when nothing in pyproject.toml changed.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  # Actions pinned by SHA (see ci.yml) still need a way to move forward.
  # Dependabot updates the pin and refreshes the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init, analyze and upload-sarif are three references to the same
      # release and must move together: analyze reads the config init wrote,
      # and a version mismatch between them fails the job outright. Without
      # this, Dependabot opens one PR per reference, and any one of them
      # merged alone breaks CodeQL.
      codeql-action:
        patterns: ["github/codeql-action*"]
